<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InvenCore | Panel Principal de Operaciones</title>

  <!-- Protección: la página se oculta hasta que main.js confirma la sesión en el servidor.
       Seguro de fallo: si en 5 s no se confirma, se va al login. -->
  <script>
    document.documentElement.classList.add("auth-pending");
    setTimeout(function () {
      if (document.documentElement.classList.contains("auth-pending")) {
        window.location.replace("views/seguridad/login.html");
      }
    }, 5000);
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

  <div class="app-layout d-flex">

    <!-- Sidebar (dinámico) -->
    <div id="sidebar-placeholder" class="sidebar-wrapper"></div>

    <!-- Columna derecha -->
    <div class="main-column flex-grow-1 d-flex flex-column">

      <!-- Header / Top bar (dinámico) -->
      <div id="header-placeholder" class="sticky-top"></div>

      <main class="flex-grow-1 py-4 px-3 px-md-4">
        <div class="content-container mx-auto">

          <!-- Tarjetas de resumen -->
          <section class="row g-3 g-xl-4 mb-4" aria-label="Resumen">
            <div class="col-12 col-md-4">
              <a href="views/catalogo/catalogo.html" class="stat-card d-block text-decoration-none">
                <div class="d-flex justify-content-between align-items-start mb-3">
                  <span class="icon-box icon-emerald"><i class="bi bi-box"></i></span>
                  <i class="bi bi-chevron-right chevron"></i>
                </div>
                <div class="stat-label">Total SKUs</div>
                <div class="stat-value" id="kpiProductos">—</div>
                <div class="stat-desc" id="kpiUnidades">Cargando...</div>
              </a>
            </div>

            <div class="col-12 col-md-4">
              <a href="views/logistica/entradas.html" class="stat-card d-block text-decoration-none">
                <div class="d-flex justify-content-between align-items-start mb-3">
                  <span class="icon-box icon-emerald"><i class="bi bi-arrow-down-left"></i></span>
                  <i class="bi bi-chevron-right chevron"></i>
                </div>
                <div class="stat-label">Entradas &amp; Compras</div>
                <div class="stat-value" id="kpiEntradas">—</div>
                <div class="stat-desc">Control de recepción e inspección</div>
              </a>
            </div>

            <div class="col-12 col-md-4">
              <a href="views/logistica/salidas.html" class="stat-card d-block text-decoration-none">
                <div class="d-flex justify-content-between align-items-start mb-3">
                  <span class="icon-box icon-blue"><i class="bi bi-arrow-up-right"></i></span>
                  <i class="bi bi-chevron-right chevron"></i>
                </div>
                <div class="stat-label">Picking &amp; Despacho</div>
                <div class="stat-value" id="kpiSalidas">—</div>
                <div class="stat-desc">Preparación de pedidos y embalaje</div>
              </a>
            </div>
          </section>

          <!-- Alertas de stock -->
          <section class="alert-card" aria-labelledby="alertas-titulo">
            <div class="alert-card-header d-flex align-items-center">
              <span class="icon-box icon-amber icon-box-sm me-3"><i class="bi bi-exclamation-triangle"></i></span>
              <h2 id="alertas-titulo" class="alert-card-title mb-0">Monitoreo de Stock Crítico y Puntos de Reorden</h2>
              <span class="badge-amber ms-2 d-none" id="alertasBadge"></span>
            </div>

            <div class="table-responsive">
              <table class="table table-borderless align-middle mb-0 stock-table">
                <thead>
                  <tr>
                    <th scope="col" class="ps-4">Código SKU</th>
                    <th scope="col">Producto</th>
                    <th scope="col">Ubicación Almacén</th>
                    <th scope="col" class="text-center">Stock Mínimo</th>
                    <th scope="col" class="text-center">Stock Actual</th>
                  </tr>
                </thead>
                <tbody id="tablaAlertas">
                  <!-- Las filas las genera dashboard.js con los datos de obtener_metricas.php -->
                </tbody>
              </table>
            </div>
          </section>

        </div>
      </main>

      <!-- Footer (dinámico) -->
      <div id="footer-placeholder"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
