<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InvenCore | Acceso de Personal</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <link href="../../assets/css/login.css" rel="stylesheet">
</head>
<body class="login-page">

  <main class="min-vh-100 d-flex flex-column align-items-center justify-content-center p-3">

    <div class="login-wrapper w-100">

      <section class="card login-card border-0">
        <div class="card-body p-4 p-sm-5">

          <!-- Logotipo y títulos -->
          <div class="text-center mb-4">
            <span class="login-logo"><i class="bi bi-boxes"></i></span>
            <h1 class="login-title mt-4 mb-2">InvenCore — Acceso de Personal</h1>
            <p class="login-subtitle mb-0">Ingresa tus credenciales para continuar</p>
          </div>

          <!-- Mensajes del servidor (login.php redirige con ?error=codigo o ?registro=ok) -->
          <div class="alert alert-danger d-none" role="alert" id="loginError"></div>
          <div class="alert alert-success d-none" role="alert" id="loginInfo"></div>

          <!-- Formulario: se envía por POST a controllers/seguridad/login.php -->
          <form id="loginForm" action="../../controllers/seguridad/login.php" method="post" novalidate>

            <!-- Correo -->
            <div class="mb-3">
              <label for="email" class="form-label login-label">Correo Electrónico</label>
              <div class="input-group login-input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="nombre@invencore.com" autocomplete="username" required>
                <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
              </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
              <label for="password" class="form-label login-label">Contraseña</label>
              <div class="input-group login-input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="••••••••" autocomplete="current-password" required>
                <button class="btn toggle-password" type="button" id="togglePassword"
                        aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="password">
                  <i class="bi bi-eye" id="togglePasswordIcon"></i>
                </button>
                <div class="invalid-feedback">Ingresa tu contraseña.</div>
              </div>
            </div>

            <!-- Recordarme / Olvidaste -->
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
              <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label login-remember" for="remember">Recordarme</label>
              </div>
              <a href="recuperar-password.html" class="login-link">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Botón principal -->
            <button type="submit" class="btn btn-login w-100">Ingresar al Sistema</button>
          </form>

          <!-- Acceso al registro -->
          <div class="login-divider my-4"><span>¿No tienes una cuenta?</span></div>
          <a href="registro.html" class="btn btn-login-outline w-100">
            <i class="bi bi-person-plus me-2"></i>Crear una cuenta
          </a>

        </div>
      </section>

      <p class="login-note text-center mt-4 mb-0">
        Acceso restringido a personal autorizado de InvenCore
      </p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/login.js"></script>
</body>
</html>
